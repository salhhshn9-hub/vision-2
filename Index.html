
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المهام الأسطوري</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #43a047;
            --danger: #e53935;
            --warning: #fb8c00;
            --light: #f7f8fc;
            --dark: #333;
        }

        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            padding: 20px;
            color: var(--dark);
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        header {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown .6s ease;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3.4rem);
            text-shadow: 2px 2px 5px #0005;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.15rem;
            opacity: .9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel,
        .report-section {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px #0003;
            animation: fadeIn .6s ease;
        }

        .report-section {
            grid-column: 1 / -1;
        }

        h2,
        h3 {
            color: var(--primary);
            margin-bottom: 20px;
        }

        .add-task {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-task input,
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            outline: none;
            transition: .2s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px #667eea33;
        }

        .add-task input {
            flex: 1;
        }

        .btn,
        .add-task button,
        .calendar-header button {
            border: 0;
            border-radius: 8px;
            padding: 11px 18px;
            font-weight: bold;
            transition: .2s;
        }

        .add-task button,
        .btn-primary,
        .calendar-header button {
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            border: 2px solid transparent;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .filter-btn.active {
            color: white;
            background: var(--primary);
            border-color: var(--secondary);
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 510px;
            overflow-y: auto;
            padding: 2px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #f8f8f8;
            border-right: 4px solid var(--primary);
            border-radius: 10px;
            transition: .2s;
        }

        .task-item:hover {
            transform: translateX(-5px);
            box-shadow: 0 4px 12px #667eea26;
        }

        .task-item.completed {
            background: #e8f5e9;
            border-right-color: var(--success);
            opacity: .72;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: #888;
        }

        .task-checkbox {
            width: 23px;
            height: 23px;
            accent-color: var(--primary);
        }

        .task-title {
            flex: 1;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .task-date {
            color: #888;
            font-size: .75rem;
        }

        .task-priority {
            padding: 4px 9px;
            border-radius: 20px;
            font-size: .75rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .priority-عالي {
            color: #c62828;
            background: #ffebee;
        }

        .priority-عادي {
            color: #e65100;
            background: #fff3e0;
        }

        .priority-منخفض {
            color: #2e7d32;
            background: #e8f5e9;
        }

        .delete-btn {
            color: #c62828;
            background: #ffebee;
            border: 0;
            border-radius: 6px;
            padding: 6px 9px;
        }

        .delete-btn:hover {
            background: #ffcdd2;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 15px;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .calendar-header h3 {
            flex: 1;
            text-align: center;
            margin: 0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 7px;
        }

        .calendar-weekday {
            text-align: center;
            color: #777;
            font-weight: bold;
            padding: 8px 2px;
        }

        .calendar-day {
            min-height: 78px;
            padding: 8px;
            border: 2px solid transparent;
            border-radius: 9px;
            background: #f8f8f8;
            cursor: pointer;
            transition: .2s;
        }

        .calendar-day:hover {
            transform: scale(1.03);
            background: #eef1ff;
        }

        .calendar-day.today {
            border-color: var(--primary);
            background: #f0f4ff;
        }

        .calendar-day.other-month {
            opacity: .38;
        }

        .day-number {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .completion-text {
            color: var(--primary);
            font-size: .75rem;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            color: white;
            text-align: center;
            padding: 22px 10px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 5px 15px #667eea55;
        }

        .stat-card h4 {
            margin-bottom: 8px;
            opacity: .9;
        }

        .stat-value {
            font-size: 2.3rem;
            font-weight: bold;
        }

        .chart-container {
            position: relative;
            height: 350px;
            margin-bottom: 25px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-secondary {
            background: #f1f1f1;
            color: #333;
            border: 2px solid var(--primary);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: #0007;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: min(500px, 100%);
            padding: 28px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 40px #0005;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            border: 0;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
        }

        .cancel {
            background: #e0e0e0;
        }

        .save {
            color: white;
            background: var(--primary);
        }

        .notification {
            position: fixed;
            z-index: 2000;
            top: 20px;
            right: 20px;
            max-width: 320px;
            padding: 15px 20px;
            color: white;
            border-radius: 8px;
            background: var(--success);
            box-shadow: 0 4px 12px #0004;
            animation: slideIn .3s ease;
        }

        .notification.error {
            background: var(--danger);
        }

        .report-item {
            margin-bottom: 10px;
            padding: 15px;
            border-right: 4px solid var(--primary);
            border-radius: 10px;
            background: #f8f8f8;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .report-section {
                grid-column: auto;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .panel,
            .report-section {
                padding: 16px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .calendar-day {
                min-height: 62px;
                padding: 5px;
                font-size: .85rem;
            }

            .task-item {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .task-title {
                min-width: 50%;
            }

            .task-priority {
                margin-right: auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🚀 تطبيق المهام الأسطوري</h1>
            <p>نظم مهامك وتتبع تقدمك يومياً بشكل احترافي</p>
        </header>

        <div class="main-grid">
            <section class="panel">
                <h3>📋 قائمة المهام</h3>

                <div class="add-task">
                    <input id="taskInput" type="text"
                           placeholder="أضف مهمة جديدة..."
                           onkeydown="if (event.key === 'Enter') addTask()">
                    <button onclick="openTaskModal()">➕ أضف</button>
                </div>

                <div class="filters">
                    <button class="filter-btn active" data-filter="all"
                            onclick="filterTasks('all')">كل المهام</button>
                    <button class="filter-btn" data-filter="completed"
                            onclick="filterTasks('completed')">✓ منجزة</button>
                    <button class="filter-btn" data-filter="pending"
                            onclick="filterTasks('pending')">⏳ قيد التنفيذ</button>
                </div>

                <div id="tasksList" class="tasks-list"></div>
            </section>

            <section class="panel">
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)">‹ السابق</button>
                    <h3 id="calendarTitle"></h3>
                    <button onclick="changeMonth(1)">التالي ›</button>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
            </section>

            <section class="report-section">
                <h2>📊 الإحصائيات والتقارير</h2>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>إجمالي المهام</h4>
                        <div id="totalTasks" class="stat-value">0</div>
                    </div>

                    <div class="stat-card">
                        <h4>المهام المنجزة</h4>
                        <div id="completedTasks" class="stat-value">0</div>
                    </div>

                    <div class="stat-card">
                        <h4>المهام المتبقية</h4>
                        <div id="pendingTasks" class="stat-value">0</div>
                    </div>

                    <div class="stat-card">
                        <h4>نسبة الإنجاز</h4>
                        <div id="completionRate" class="stat-value">0%</div>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="progressChart"></canvas>
                </div>

                <div id="reportsList"></div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="openTaskModal()">
                        ➕ إضافة مهمة
                    </button>
                    <button class="btn btn-secondary" onclick="exportTasks()">
                        📥 تصدير المهام
                    </button>
                    <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">
                        📤 استيراد المهام
                    </button>
                    <button class="btn btn-secondary" onclick="clearCompleted()">
                        🧹 حذف المنجزة
                    </button>
                    <button class="btn btn-secondary" onclick="clearAllTasks()">
                        🗑️ حذف الكل
                    </button>
                    <input id="importFile" type="file" accept=".json"
                           hidden onchange="importTasks(event)">
                </div>
            </section>
        </div>
    </div>

    <div id="taskModal" class="modal" onclick="closeModalOnBackground(event)">
        <div class="modal-content">
            <h2>➕ إضافة مهمة جديدة</h2>

            <div class="form-group">
                <label for="modalTaskTitle">اسم المهمة</label>
                <input id="modalTaskTitle" type="text" placeholder="اكتب اسم المهمة">
            </div>

            <div class="form-group">
                <label for="taskPriority">الأولوية</label>
                <select id="taskPriority">
                    <option value="عالي">🔴 عالي</option>
                    <option value="عادي" selected>🟠 عادي</option>
                    <option value="منخفض">🟢 منخفض</option>
                </select>
            </div>

            <div class="form-group">
                <label for="taskDate">التاريخ</label>
                <input id="taskDate" type="date">
            </div>

            <div class="modal-buttons">
                <button class="cancel" onclick="closeTaskModal()">إلغاء</button>
                <button class="save" onclick="saveTask()">حفظ المهمة</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "legendary_tasks_v1";

        let tasks = loadTasks();
        let currentFilter = "all";
        let currentDate = new Date();
        let progressChart;

        const todayISO = () => {
            const date = new Date();
            const offset = date.getTimezoneOffset();
            return new Date(date.getTime() - offset * 60000)
                .toISOString()
                .split("T")[0];
        };

        function loadTasks() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : [];
            } catch {
                return [];
            }
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function createId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2);
        }

        function addTask() {
            const input = document.getElementById("taskInput");
            const title = input.value.trim();

            if (!title) {
                showNotification("اكتب اسم المهمة أولاً", true);
                input.focus();
                return;
            }

            tasks.unshift({
                id: createId(),
                title,
                priority: "عادي",
                date: todayISO(),
                completed: false,
                createdAt: new Date().toISOString(),
                completedAt: null
            });

            input.value = "";
            saveTasks();
            renderAll();
            showNotification("تمت إضافة المهمة بنجاح");
        }

        function openTaskModal() {
            document.getElementById("taskModal").classList.add("active");
            document.getElementById("modalTaskTitle").value =
                document.getElementById("taskInput").value.trim();

            document.getElementById("taskDate").value = todayISO();
            document.getElementById("modalTaskTitle").focus();
        }

        function closeTaskModal() {
            document.getElementById("taskModal").classList.remove("active");
        }

        function closeModalOnBackground(event) {
            if (event.target.id === "taskModal") closeTaskModal();
        }

        function saveTask() {
            const title = document.getElementById("modalTaskTitle").value.trim();
            const priority = document.getElementById("taskPriority").value;
            const date = document.getElementById("taskDate").value || todayISO();

            if (!title) {
                showNotification("اكتب اسم المهمة أولاً", true);
                return;
            }

            tasks.unshift({
                id: createId(),
                title,
                priority,
                date,
                completed: false,
                createdAt: new Date().toISOString(),
                completedAt: null
            });

            saveTasks();
            closeTaskModal();
            renderAll();
            showNotification("تم حفظ المهمة بنجاح");
        }

        function toggleTask(id) {
            const task = tasks.find(item => item.id === id);
            if (!task) return;

            task.completed = !task.completed;
            task.completedAt = task.completed ? new Date().toISOString() : null;

            saveTasks();
            renderAll();
            showNotification(task.completed ? "أحسنت! تم إنجاز المهمة 🎉" : "تم إعادة المهمة إلى القائمة");
        }

        function deleteTask(id) {
            const task = tasks.find(item => item.id === id);
            if (!task) return;

            if (!confirm(`هل تريد حذف المهمة "${task.title}"؟`)) return;

            tasks = tasks.filter(item => item.id !== id);
            saveTasks();
            renderAll();
            showNotification("تم حذف المهمة");
        }

        function filterTasks(filter) {
            currentFilter = filter;

            document.querySelectorAll(".filter-btn").forEach(button => {
                button.classList.toggle(
                    "active",
                    button.dataset.filter === filter
                );
            });

            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById("tasksList");

            let filtered = tasks;

            if (currentFilter === "completed") {
                filtered = tasks.filter(task => task.completed);
            }

            if (currentFilter === "pending") {
                filtered = tasks.filter(task => !task.completed);
            }

            if (!filtered.length) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <div>${
                            currentFilter === "all"
                                ? "لم تضف أي مهمة بعد"
                                : "لا توجد مهام في هذا التصنيف"
                        }</div>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(task => `
                <div class="task-item ${task.completed ? "completed" : ""}">
                    <input
                        class="task-checkbox"
                        type="checkbox"
                        ${task.completed ? "checked" : ""}
                        onchange="toggleTask('${task.id}')"
                        aria-label="تحديد المهمة كمكتملة"
                    >

                    <div class="task-info">
                        <div class="task-title">${escapeHTML(task.title)}</div>
                        <div class="task-date">📅 ${formatDate(task.date)}</div>
                    </div>

                    <span class="task-priority priority-${task.priority}">
                        ${task.priority}
                    </span>

                    <button class="delete-btn"
                            onclick="deleteTask('${task.id}')">
                        حذف
                    </button>
                </div>
            `).join("");
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById("calendarTitle").textContent =
                new Intl.DateTimeFormat("ar-SA", {
                    month: "long",
                    year: "numeric"
                }).format(currentDate);

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const previousLastDay = new Date(year, month, 0).getDate();

            let startDay = firstDay.getDay();
            startDay = startDay === 0 ? 6 : startDay - 1;

            const cells = [];

            for (let i = startDay - 1; i >= 0; i--) {
                const day = previousLastDay - i;
                cells.push(calendarCell(day, year, month - 1, true));
            }

            for (let day = 1; day <= lastDay.getDate(); day++) {
                cells.push(calendarCell(day, year, month, false));
            }

            let nextDay = 1;
            while (cells.length < 42) {
                cells.push(calendarCell(nextDay++, year, month + 1, true));
            }

            const weekdays = ["الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت", "الأحد"];

            document.getElementById("calendarGrid").innerHTML =
                weekdays.map(day => `<div class="calendar-weekday">${day}</div>`).join("") +
                cells.join("");
        }

        function calendarCell(day, year, month, otherMonth) {
            const date = new Date(year, month, day);
            const iso = toISO(date);
            const dayTasks = tasks.filter(task => task.date === iso);
            const completed = dayTasks.filter(task => task.completed).length;
            const isToday = iso === todayISO();

            return `
                <div class="calendar-day ${otherMonth ? "other-month" : ""} ${isToday ? "today" : ""}"
                     title="${dayTasks.length} مهمة"
                     onclick="showDayTasks('${iso}')">
                    <div class="day-number">${day}</div>
                    ${
                        dayTasks.length
                            ? `<div class="completion-text">${completed}/${dayTasks.length} منجزة</div>`
                            : `<div class="completion-text">لا توجد مهام</div>`
                    }
                </div>
            `;
        }

        function changeMonth(amount) {
            currentDate.setMonth(currentDate.getMonth() + amount);
            renderCalendar();
        }

        function showDayTasks(date) {
            const dayTasks = tasks.filter(task => task.date === date);

            if (!dayTasks.length) {
                showNotification("لا توجد مهام في هذا اليوم");
                return;
            }

            const completed = dayTasks.filter(task => task.completed).length;
            showNotification(`في هذا اليوم ${dayTasks.length} مهام، أُنجز منها ${completed}`);
        }

        function renderStats() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            const pending = total - completed;
            const rate = total ? Math.round((completed / total) * 100) : 0;

            document.getElementById("totalTasks").textContent = total;
            document.getElementById("completedTasks").textContent = completed;
            document.getElementById("pendingTasks").textContent = pending;
            document.getElementById("completionRate").textContent = `${rate}%`;

            renderReports();
            renderChart();
        }

        function renderReports() {
            const report = document.getElementById("reportsList");
            const high = tasks.filter(task => task.priority === "عالي" && !task.completed).length;
            const today = tasks.filter(task => task.date === todayISO());
            const todayCompleted = today.filter(task => task.completed).length;

            report.innerHTML = `
                <div class="report-item">
                    📌 لديك <strong>${high}</strong> مهام عالية الأولوية غير منجزة.
                </div>
                <div class="report-item">
                    📅 مهام اليوم: <strong>${today.length}</strong>،
                    والمنجز منها: <strong>${todayCompleted}</strong>.
                </div>
                <div class="report-item">
                    🏆 استمر في التقدم! نسبة إنجازك الحالية:
                    <strong>${tasks.length ? Math.round(tasks.filter(t => t.completed).length / tasks.length * 100) : 0}%</strong>.
                </div>
            `;
        }

        function renderChart() {
            const completed = tasks.filter(task => task.completed).length;
            const pending = tasks.length - completed;

            if (progressChart) progressChart.destroy();

            progressChart = new Chart(
                document.getElementById("progressChart"),
                {
                    type: "doughnut",
                    data: {
                        labels: ["منجزة", "قيد التنفيذ"],
                        datasets: [{
                            data: [completed, pending],
                            backgroundColor: ["#43a047", "#667eea"],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: "bottom",
                                labels: {
                                    font: {
                                        family: "Segoe UI",
                                        size: 14
                                    }
                                }
                            }
                        }
                    }
                }
            );
        }

        function clearCompleted() {
            const count = tasks.filter(task => task.completed).length;

            if (!count) {
                showNotification("لا توجد مهام منجزة للحذف", true);
                return;
            }

            if (!confirm(`سيتم حذف ${count} مهام منجزة، هل أنت متأكد؟`)) return;

            tasks = tasks.filter(task => !task.completed);
            saveTasks();
            renderAll();
            showNotification("تم حذف المهام المنجزة");
        }

        function clearAllTasks() {
            if (!tasks.length) {
                showNotification("لا توجد مهام للحذف", true);
                return;
            }

            if (!confirm("سيتم حذف جميع المهام نهائياً، هل أنت متأكد؟")) return;

            tasks = [];
            saveTasks();
            renderAll();
            showNotification("تم حذف جميع المهام");
        }

        function exportTasks() {
            if (!tasks.length) {
                showNotification("لا توجد مهام لتصديرها", true);
                return;
            }

            const blob = new Blob(
                [JSON.stringify(tasks, null, 2)],
                { type: "application/json;charset=utf-8" }
            );

            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `مهامي-${todayISO()}.json`;
            link.click();
            URL.revokeObjectURL(link.href);

            showNotification("تم تصدير المهام بنجاح");
        }

        function importTasks(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function () {
                try {
                    const imported = JSON.parse(reader.result);

                    if (!Array.isArray(imported)) {
                        throw new Error();
                    }

                    const validTasks = imported
                        .filter(task => task.title)
                        .map(task => ({
                            id: task.id || createId(),
                            title: String(task.title),
                            priority: ["عالي", "عادي", "منخفض"].includes(task.priority)
                                ? task.priority
                                : "عادي",
                            date: task.date || todayISO(),
                            completed: Boolean(task.completed),
                            createdAt: task.createdAt || new Date().toISOString(),
                            completedAt: task.completedAt || null
                        }));

                    tasks = validTasks;
                    saveTasks();
                    renderAll();
                    showNotification(`تم استيراد ${validTasks.length} مهمة`);
                } catch {
                    showNotification("ملف غير صالح", true);
                }

                event.target.value = "";
            };

            reader.readAsText(file);
        }

        function formatDate(date) {
            if (!date) return "بدون تاريخ";

            return new Intl.DateTimeFormat("ar-SA", {
                day: "numeric",
                month: "short",
                year: "numeric"
            }).format(new Date(`${date}T00:00:00`));
        }

        function toISO(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function showNotification(message, error = false) {
            const old = document.querySelector(".notification");
            if (old) old.remove();

            const notification = document.createElement("div");
            notification.className = `notification ${error ? "error" : ""}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 3000);
        }

        function renderAll() {
            renderTasks();
            renderCalendar();
            renderStats();
        }

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeTaskModal();
        });

        renderAll();
    </script>
</body>
</html>
