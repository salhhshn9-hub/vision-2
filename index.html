<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finance OS Pro Max</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:'Cairo';
background:#0b1220;
color:white;
}

.top{
padding:15px;
background:rgba(255,255,255,0.05);
display:flex;
justify-content:space-between;
align-items:center;
}

.tab{display:none;padding:15px;}
.tab.active{display:block;}

.card{
background:rgba(255,255,255,0.05);
padding:15px;
margin:10px;
border-radius:15px;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:10px;
border:none;
background:#111827;
color:white;
}

button{
padding:10px;
width:100%;
margin-top:8px;
border:none;
border-radius:10px;
background:#3b82f6;
color:white;
font-weight:bold;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
padding:10px;
background:#0b1220;
border-top:1px solid #333;
}

.nav button{
background:none;
font-size:18px;
}
</style>
</head>

<body>

<div class="top">
<b>🏦 Finance OS</b>
<button onclick="show('tx')">＋</button>
</div>

<!-- DASHBOARD -->
<div id="home" class="tab active">

<div class="card">
<h3>الرصيد</h3>
<h1 id="balance">0</h1>
</div>

<div class="card">
دخل: <span id="inc">0</span><br>
مصروف: <span id="exp">0</span><br>
دين: <span id="debt">0</span>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<!-- TX -->
<div id="tx" class="tab">

<div class="card">
<select id="type">
<option value="income">دخل</option>
<option value="expense">مصروف</option>
<option value="debt">دين</option>
</select>

<input id="amount" placeholder="المبلغ" type="number">
<input id="note" placeholder="ملاحظة">

<button onclick="add()">حفظ</button>
</div>

<div id="list"></div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">🏠</button>
<button onclick="show('tx')">💰</button>
</div>

<script>

let db = JSON.parse(localStorage.getItem("db")||'{"tx":[]}');

function save(){
localStorage.setItem("db",JSON.stringify(db));
render();
}

function add(){
db.tx.push({
type:type.value,
amount:+amount.value,
note:note.value,
date:new Date().toLocaleString()
});
save();
}

function calc(){
let i=0,e=0,d=0;

db.tx.forEach(t=>{
if(t.type=="income") i+=t.amount;
if(t.type=="expense") e+=t.amount;
if(t.type=="debt") d+=t.amount;
});

return {i,e,d,n:i-e};
}

function render(){

let f=calc();

balance.innerText=f.n;
inc.innerText=f.i;
exp.innerText=f.e;
debt.innerText=f.d;

list.innerHTML="";

db.tx.slice().reverse().forEach(t=>{
list.innerHTML+=`
<div class="card">
<b>${t.type}</b><br>
${t.amount}<br>
${t.note}<br>
<small>${t.date}</small>
</div>`;
});
}

function show(id){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

render();

</script>

</body>
</html>
