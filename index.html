<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Finance Ultra Hub Pro</title>
    <meta name="theme-color" content="#0d0e15">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #161926 0%, #08090d 100%);
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-accent: rgba(255, 255, 255, 0.08);
            --neon-green: #00e676;
            --neon-blue: #00b0ff;
            --neon-orange: #ff9100;
            --neon-red: #ff1744;
            --neon-purple: #d500f9;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --font-ar: 'Tajawal', sans-serif;
            --font-en: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); color: var(--text-primary); font-family: var(--font-ar); min-height: 100vh; display: flex; justify-content: center; overflow-x: hidden; }
        
        .app-container { width: 100%; max-width: 480px; background: rgba(8, 9, 13, 0.96); min-height: 100vh; position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border); box-shadow: 0 0 50px rgba(0,0,0,0.8); padding-bottom: 40px; }
        
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 22px; margin: 12px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 25px 20px 15px 20px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue)); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #fff; box-shadow: 0 0 15px rgba(213,0,249,0.4); }
        .logo-text h2 { font-size: 1.15rem; font-weight: 900; background: linear-gradient(120deg, #fff, var(--text-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text p { font-size: 0.75rem; color: var(--text-secondary); font-family: var(--font-en); font-weight: 600; letter-spacing: 0.5px; margin-top: 1px; }

        .balance-display { text-align: center; padding: 15px 0 5px 0; }
        .balance-display p { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .balance-display h1 { font-family: var(--font-en); font-size: 2.75rem; font-weight: 700; margin: 6px 0; letter-spacing: -0.5px; background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .action-hub { padding: 0 16px; margin-top: 5px; }
        .btn-main-action { width: 100%; padding: 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08); background: linear-gradient(135deg, rgba(213,0,249,0.15) 0%, rgba(0,176,255,0.15) 100%); color: #fff; font-family: var(--font-ar); font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: var(--transition); box-shadow: inset 0 1px 1px rgba(255,255,255,0.1); }
        .btn-main-action:active { transform: scale(0.98); background: linear-gradient(135deg, rgba(213,0,249,0.25) 0%, rgba(0,176,255,0.25) 100%); }

        .section-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); padding: 15px 22px 8px 22px; display: flex; justify-content: space-between; align-items: center; }
        .section-title span { font-size: 0.75rem; color: var(--text-secondary); font-weight: normal; font-family: var(--font-en); }

        .logs-container { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
        .log-card { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 14px 16px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; transition: var(--transition); }
        .log-card:active { background: var(--glass-accent); }
        
        .log-info { display: flex; align-items: center; gap: 12px; }
        .log-icon-box { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .log-icon-box.add { background: rgba(0, 230, 118, 0.08); color: var(--neon-green); border: 1px solid rgba(0, 230, 118, 0.15); }
        .log-icon-box.sub { background: rgba(255, 23, 68, 0.08); color: var(--neon-red); border: 1px solid rgba(255, 23, 68, 0.15); }
        
        .log-details strong { display: block; font-size: 0.9rem; color: #fff; margin-bottom: 2px; }
        .log-details span { font-size: 0.72rem; color: var(--text-secondary); font-family: var(--font-en); }
        
        .log-amount-area { text-align: left; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .log-amount { font-family: var(--font-en); font-weight: 700; font-size: 0.95rem; }
        .log-amount.add { color: var(--neon-green); }
        .log-amount.sub { color: var(--neon-red); }
        
        .btn-delete-log { background: transparent; border: none; color: var(--text-secondary); opacity: 0.3; cursor: pointer; font-size: 0.8rem; padding: 2px 5px; transition: var(--transition); }
        .btn-delete-log:hover { opacity: 1; color: var(--neon-red); }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 6, 10, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 9999; display: none; justify-content: center; align-items: flex-end; }
        .modal-overlay.active { display: flex; }
        .modal-sheet { width: 100%; max-width: 480px; background: #0c0e17; border-top-left-radius: 32px; border-top-right-radius: 32px; border-top: 1px solid var(--glass-border); padding: 30px 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.6); animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); max-height: 85vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .modal-header h3 { font-size: 1.15rem; font-weight: 700; }
        .btn-close-modal { width: 32px; height: 32px; background: var(--glass-accent); border: 1px solid var(--glass-border); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }
        .form-control { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 14px 16px; border-radius: 14px; color: #fff; font-family: inherit; font-size: 0.95rem; transition: var(--transition); }
        .form-control:focus { outline: none; border-color: var(--neon-purple); background: rgba(255,255,255,0.06); }
        
        .type-selector { display: flex; gap: 12px; margin-bottom: 20px; }
        .type-btn { flex: 1; padding: 14px; border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.02); color: var(--text-secondary); cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); }
        .type-btn.sub.active { background: rgba(255, 23, 68, 0.1); border-color: var(--neon-red); color: var(--neon-red); }
        .type-btn.add.active { background: rgba(0, 230, 118, 0.1); border-color: var(--neon-green); color: var(--neon-green); }
        
        .btn-submit { width: 100%; padding: 16px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue)); color: #fff; font-family: var(--font-ar); font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(213,0,249,0.25); }

        .btn-reset-system { background: transparent; border: 1px dashed rgba(255, 23, 68, 0.2); color: rgba(255, 23, 68, 0.6); padding: 12px; border-radius: 14px; font-weight: bold; font-family: inherit; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; margin: 20px 16px 10px 16px; transition: var(--transition); }
        .btn-reset-system:hover { border-color: var(--neon-red); color: var(--neon-red); background: rgba(255, 23, 68, 0.05); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header>
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <div class="logo-text">
                    <h2>Family Finance</h2>
                    <p>ULTRA HUB PRO</p>
                </div>
            </div>
        </header>

        <div class="glass-card" style="background: linear-gradient(135deg, rgba(213,0,249,0.04) 0%, rgba(13,14,21,0.5) 100%); border-color: rgba(213,0,249,0.15);">
            <div class="balance-display">
                <p><i class="fa-solid fa-wallet" style="color: var(--neon-purple);"></i> إجمالي الميزانية الحالية المتاحة</p>
                <h1 id="global-balance">0.00</h1>
                <span style="font-size: 0.8rem; color: var(--text-secondary); font-weight: bold;">ريال سعودي</span>
            </div>
        </div>

        <div class="action-hub">
            <button class="btn-main-action" onclick="openModal('modal-add-transaction')">
                <i class="fa-solid fa-plus-circle" style="font-size: 1.1rem;"></i> إضافة حركة مالية جديدة
            </button>
        </div>

        <div class="section-title">
            <h3><i class="fa-solid fa-history" style="color: var(--neon-blue); margin-left: 6px;"></i> سجل العمليات الأخير</h3>
            <span id="log-count">0 عمليات</span>
        </div>

        <div class="logs-container" id="logs-target"></div>

        <button class="btn-reset-system" onclick="executeSystemReset()">
            <i class="fa-solid fa-trash-can"></i> تهيئة ومسح البيانات والبدء من الصفر
        </button>

    </div>

    <div id="modal-add-transaction" class="modal-overlay" onclick="closeModalOnOuterClick(event, 'modal-add-transaction')">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3>إضافة حركة مالية جديدة</h3>
                <div class="btn-close-modal" onclick="closeModal('modal-add-transaction')">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            </div>

            <label style="display:block; margin-bottom:8px; font-size:0.85rem; color:var(--text-secondary);">نوع العملية المالي</label>
            <div class="type-selector">
                <button id="type-sub" class="type-btn sub active" onclick="setTransactionType('sub')">
                    <i class="fa-solid fa-arrow-down-long"></i> مصروف / خصم
                </button>
                <button id="type-add" class="type-btn add" onclick="setTransactionType('add')">
                    <i class="fa-solid fa-arrow-up-long"></i> إيداع / إضافة
                </button>
            </div>

            <div class="form-group">
                <label>اسم الحركة أو البيان (مثال: مقاضي البيت، الراتب، بنزين)</label>
                <input type="text" id="tx-name" class="form-control" placeholder="اكتب وصفاً مختصراً هنا...">
            </div>

            <div class="form-group">
                <label>المبلغ الإجمالي (ر.س)</label>
                <input type="number" id="tx-amount" class="form-control" placeholder="0.00" inputmode="decimal">
            </div>

            <button class="btn-submit" onclick="executeSaveTransaction()">تأكيد وحفظ العملية فوراً</button>
        </div>
    </div>

    <script>
        let state = {
            db: {
                balance: 0,
                logs: []
            },
            currentType: 'sub' // النوع الافتراضي مصروف
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadDatabase();
            renderApp();
        });

        function loadDatabase() {
            const raw = localStorage.getItem('FAMILY_FINANCE_SIMPLIFIED_DB');
            if(raw) {
                try {
                    state.db = JSON.parse(raw);
                    if(!state.db.logs) state.db.logs = [];
                } catch (e) {
                    initCleanDB();
                }
            } else {
                initCleanDB();
            }
        }

        function initCleanDB() {
            state.db = {
                balance: 0,
                logs: []
            };
            commit();
        }

        function commit() {
            localStorage.setItem('FAMILY_FINANCE_SIMPLIFIED_DB', JSON.stringify(state.db));
        }

        function renderApp() {
            // إعادة حساب الرصيد الإجمالي بناءً على الحركات تلافياً لأي خطأ
            let total = 0;
            state.db.logs.forEach(l => {
                if(l.type === 'add') {
                    total += l.amount;
                } else {
                    total -= l.amount;
                }
            });
            state.db.balance = total;

            // عرض البيانات على الواجهة
            document.getElementById('global-balance').innerText = state.db.balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('log-count').innerText = `${state.db.logs.length} عملية مسجلة`;

            renderLogsList();
        }

        function renderLogsList() {
            const container = document.getElementById('logs-target');
            container.innerHTML = '';

            if(state.db.logs.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 10px; color:var(--text-secondary); font-size:0.85rem;">
                        <i class="fa-solid fa-receipt" style="font-size:2rem; margin-bottom:10px; display:block; opacity:0.2;"></i>
                        لا توجد حركات مالية مسجلة حالياً بالمنصة.
                    </div>
                `;
                return;
            }

            // عرض الحركات مرتبة من الأحدث للأقدم
            state.db.logs.slice().reverse().forEach((l, revIndex) => {
                const actualIndex = state.db.logs.length - 1 - revIndex;
                const card = document.createElement('div');
                card.className = 'log-card';

                const isAdd = l.type === 'add';
                const sign = isAdd ? '+' : '-';
                const typeClass = isAdd ? 'add' : 'sub';
                const icon = isAdd ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';

                card.innerHTML = `
                    <div class="log-info">
                        <div class="log-icon-box ${typeClass}">
                            <i class="fa-solid ${icon}"></i>
                        </div>
                        <div class="log-details">
                            <strong>${l.name}</strong>
                            <span>${l.date}</span>
                        </div>
                    </div>
                    <div class="log-amount-area">
                        <span class="log-amount ${typeClass}">${sign} ${l.amount.toFixed(2)} ر.س</span>
                        <button class="btn-delete-log" onclick="executeDeleteLog(${actualIndex})">
                            <i class="fa-solid fa-trash-can"></i> حذف
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setTransactionType(type) {
            state.currentType = type;
            document.getElementById('type-sub').classList.toggle('active', type === 'sub');
            document.getElementById('type-add').classList.toggle('active', type === 'add');
        }

        function executeSaveTransaction() {
            const name = document.getElementById('tx-name').value.trim();
            const amount = parseFloat(document.getElementById('tx-amount').value);

            if(!name) { alert("الرجاء كتابة اسم الحركة أو الوصف!"); return; }
            if(isNaN(amount) || amount <= 0) { alert("الرجاء إدخال مبلغ صحيح أكبر من الصفر!"); return; }

            const today = new Date();
            const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')} ${String(today.getHours()).padStart(2,'0')}:${String(today.getMinutes()).padStart(2,'0')}`;

            state.db.logs.push({
                name: name,
                amount: amount,
                type: state.currentType,
                date: dateStr
            });

            // تصفير الخانات
            document.getElementById('tx-name').value = '';
            document.getElementById('tx-amount').value = '';
            setTransactionType('sub'); // إرجاع الخيار الافتراضي لمصروف

            closeModal('modal-add-transaction');
            commit();
            renderApp();
        }

        function executeDeleteLog(index) {
            if(confirm("هل أنت متأكد من رغبتك في حذف وتراجع هذه الحركة نهائياً؟")) {
                state.db.logs.splice(index, 1);
                commit();
                renderApp();
            }
        }

        function executeSystemReset() {
            if(confirm("⚠️ تنبيه شديد الخطورة:\nهل تريد مسح جميع الحركات والتحركات بالكامل والبدء من الصفر؟")) {
                initCleanDB();
                renderApp();
                alert("تم تصفير المنصة بالكامل بنجاح 🚀");
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeModalOnOuterClick(e, id) { if(e.target === document.getElementById(id)) closeModal(id); }
    </script>
</body>
</html>
