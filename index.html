<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Finance Ultra Pro Max - الدفتر</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; }

        .card {
            background: var(--glass-bg);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-danger { background: var(--accent-red); color: white; }

        .summary-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        .summary-card.plus { color: var(--accent-green); }
        .summary-card.minus { color: var(--accent-red); }

        .record-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-info p { margin-bottom: 4px; }
        .record-type { font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; }
        .type-debt { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
        .type-deposit { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }

        .actions { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; width: auto; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content { background: #1e1b4b; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Family Finance Ultra Pro Max</h1>
        <p class="subtitle">دفتر الديون، الأمانات، وفواتير البقالة</p>
    </header>

    <!-- الملخص المالي -->
    <div class="summary-box">
        <div class="summary-card minus">
            <div>عليّ (ديون وبقالة)</div>
            <div id="total-debts">0 رس</div>
        </div>
        <div class="summary-card plus">
            <div>لي (أمانات وودائع)</div>
            <div id="total-deposits">0 رس</div>
        </div>
    </div>

    <!-- نموذج إضافة سجل جديد -->
    <div class="card">
        <h3>إضافة سجل جديد</h3>
        <br>
        <div class="form-group">
            <label>الاسم / الجهة (مثال: بقالة الحارة، أحمد)</label>
            <input type="text" id="person-name" placeholder="أدخل الاسم">
        </div>
        <div class="form-group">
            <label>المبلغ (ريال)</label>
            <input type="number" id="amount" placeholder="0.00">
        </div>
        <div class="form-group">
            <label>نوع المعاملة</label>
            <select id="transaction-type">
                <option value="debt">دين عليّ (أنا متسلف أو فاتورة بقالة)</option>
                <option value="deposit">أمانة عندي (شخص حط عندي فلوس)</option>
            </select>
        </div>
        <button class="btn-primary" onclick="addRecord()">حفظ في الدفتر</button>
    </div>

    <!-- قائمة السجلات -->
    <div class="card">
        <h3>قائمة الدفتر الحالي</h3>
        <br>
        <div id="records-list">
            <!-- السجلات بتنزل هنا تلقائياً -->
        </div>
    </div>

    <!-- زر إعادة تعيين وتصفير الموقع -->
    <button class="btn-danger" style="margin-top: 20px;" onclick="resetAllData()">⚠️ تصفير الدفتر والبدء من جديد</button>
</div>

<!-- مودال السداد الجزئي المرن -->
<div class="modal" id="payment-modal">
    <div class="card modal-content">
        <h3>تسديد مبلغ (مرن)</h3>
        <br>
        <div class="form-group">
            <label>المبلغ المراد سداده حالياً:</label>
            <input type="number" id="partial-payment-amount" placeholder="ادفع المتاح 100، 200...">
        </div>
        <div class="actions">
            <button class="btn-primary" onclick="submitPayment()">تأكيد الدفع</button>
            <button class="btn-danger" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('finance_records')) || [];
    let activeRecordIndex = null;

    function saveToStorage() {
        localStorage.setItem('finance_records', JSON.stringify(records));
        render();
    }

    function addRecord() {
        const name = document.getElementById('person-name').value.trim();
        const amount = parseFloat(document.getElementById('amount').value);
        const type = document.getElementById('transaction-type').value;

        if (!name || isNaN(amount) || amount <= 0) {
            alert('الرجاء إدخال اسم ومبلغ صحيحين!');
            return;
        }

        records.push({ name, amount, type, date: new Date().toLocaleDateString('ar-SA') });
        
        // تصفير الحقول بعد الإضافة
        document.getElementById('person-name').value = '';
        document.getElementById('amount').value = '';
        
        saveToStorage();
    }

    function openPaymentModal(index) {
        activeRecordIndex = index;
        document.getElementById('partial-payment-amount').value = records[index].amount; // يظهر المبلغ الكامل كخيار مبدئي
        document.getElementById('payment-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('payment-modal').style.display = 'none';
        activeRecordIndex = null;
    }

    function submitPayment() {
        const paymentAmount = parseFloat(document.getElementById('partial-payment-amount').value);
        if (isNaN(paymentAmount) || paymentAmount <= 0) {
            alert('الرجاء إدخال مبلغ سداد صحيح');
            return;
        }

        const currentRecord = records[activeRecordIndex];

        if (paymentAmount >= currentRecord.amount) {
            // سداد كامل، نحذف السجل
            records.splice(activeRecordIndex, 1);
        } else {
            // سداد جزئي مرن (100، 200 حسب المقدرة)
            currentRecord.amount -= paymentAmount;
        }

        closeModal();
        saveToStorage();
    }

    function resetAllData() {
        if (confirm('هل أنت متأكد تماماً أنك تريد حذف وتصفير كل البيانات والبدء من الصفر؟')) {
            records = [];
            saveToStorage();
        }
    }

    function render() {
        const listContainer = document.getElementById('records-list');
        listContainer.innerHTML = '';

        let totalDebts = 0;
        let totalDeposits = 0;

        if (records.length === 0) {
            listContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center;">الدفتر فارغ حالياً.</p>';
        }

        records.forEach((record, index) => {
            if (record.type === 'debt') totalDebts += record.amount;
            if (record.type === 'deposit') totalDeposits += record.amount;

            const item = document.createElement('div');
            item.className = 'record-item';
            item.innerHTML = `
                <div class="record-info">
                    <p><strong>${record.name}</strong></p>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">${record.date} • <span class="record-type ${record.type === 'debt' ? 'type-debt' : 'type-deposit'}">${record.type === 'debt' ? 'دين / بقالة' : 'أمانة'}</span></p>
                </div>
                <div style="text-align: left;">
                    <p style="font-weight: bold; margin-bottom: 8px;">${record.amount} رس</p>
                    <div class="actions">
                        <button class="btn-primary btn-sm" onclick="openPaymentModal(${index})">سداد</button>
                    </div>
                </div>
            `;
            listContainer.appendChild(item);
        });

        document.getElementById('total-debts').innerText = totalDebts + ' رس';
        document.getElementById('total-deposits').innerText = totalDeposits + ' رس';
    }

    // تشغيل العرض الأولي عند فتح الصفحة
    render();
</script>

</body>
</html>
