<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Finance Ultra Hub Pro</title>
    <meta name="theme-color" content="#0d0e15">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #161926 0%, #08090d 100%);
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --neon-green: #00e676;
            --neon-blue: #00b0ff;
            --neon-orange: #ff9100;
            --neon-red: #ff1744;
            --neon-purple: #d500f9;
            --neon-yellow: #ffd600;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --font-ar: 'Tajawal', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); color: var(--text-primary); font-family: var(--font-ar); min-height: 100vh; overflow-x: hidden; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 480px; background: rgba(8, 9, 13, 0.98); min-height: 100vh; position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border); box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 22px; margin: 12px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        
        /* Navigation Bottom Tabs Style */
        .nav-tabs { display: flex; gap: 10px; padding: 0 16px; margin-top: 20px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 14px; color: var(--text-secondary); cursor: pointer; font-family: inherit; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 8px; transition: var(--transition); }
        .tab-btn.active { background: rgba(0, 176, 255, 0.1); border-color: var(--neon-blue); color: #fff; }

        /* Pages System */
        .app-page { display: none; width: 100%; animation: fadeIn 0.3s ease; }
        .app-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Categories Upper Grid */
        .categories-grid { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; margin-bottom: 15px; }
        .cat-card { background: rgba(255,255,255,0.01); border: 1px solid var(--glass-border); border-radius: 18px; padding: 16px; display: flex; justify-content: space-between; align-items: center; transition: var(--transition); }
        
        .cat-info h4 { font-size: 1.15rem; font-family: 'Plus Jakarta Sans', sans-serif; margin-top: 2px; }
        .cat-actions { display: flex; gap: 8px; }
        .action-btn { border: none; padding: 8px 12px; border-radius: 10px; font-family: inherit; font-weight: bold; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: var(--transition); }
        .action-btn.add { background: rgba(0, 176, 255, 0.15); color: var(--neon-blue); }
        .action-btn.pay { background: rgba(0, 230, 118, 0.15); color: var(--neon-green); }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); z-index: 99999; display: none; justify-content: center; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { width: 100%; max-width: 480px; background: #0f111a; border-top-left-radius: 32px; border-top-right-radius: 32px; border-top: 1px solid var(--glass-border); padding: 30px 24px; max-height: 85vh; overflow-y: auto; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-secondary); }
        .form-control { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); padding: 14px; border-radius: 14px; color: #fff; font-family: inherit; font-size: 1rem; }
        
        .btn-submit { width: 100%; padding: 15px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-back { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 10px 16px; border-radius: 14px; cursor: pointer; font-size: 0.9rem; width: 100%; display: block; text-align: center; margin-top: 15px; font-weight: bold; }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: rgba(255,255,255,0.01); border-radius: 14px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.03); }
        
        .btn-reset-system { background: transparent; border: 1px dashed var(--neon-red); color: var(--neon-red); padding: 12px; border-radius: 14px; font-weight: bold; font-family: inherit; font-size: 0.85rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; margin: 20px 16px; width: calc(100% - 32px); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchMainTab('grocery')"><i class="fa-solid fa-basket-shopping"></i> دفتر الديون والفواتير</button>
        </div>

        <div id="page-grocery" class="app-page active">
            
            <div class="glass-card" style="background: linear-gradient(135deg, #1e1b10 0%, #0c0a05 100%); border-color: rgba(255,214,0,0.2); text-align: center; margin-bottom: 15px;">
                <i class="fa-solid fa-file-invoice-dollar" style="font-size: 2rem; color: var(--neon-yellow); margin-bottom: 8px;"></i>
                <p style="color: var(--text-secondary); font-size: 0.85rem;">📑 إجمالي الديون والفواتير المتبقية عليك حالياً</p>
                <h1 style="font-size: 2.5rem; margin: 4px 0; color: var(--neon-yellow); font-family: 'Plus Jakarta Sans';" id="grocery-total-bill">0.00 ر.س</h1>
                
                <button class="btn-submit" style="background: var(--text-primary); color: #000; padding: 10px; font-size: 0.85rem; margin-top: 10px; border-radius: 12px;" onclick="openModal('modal-create-category')">
                    <i class="fa-solid fa-folder-plus"></i> إنشاء فئة فواتير جديدة من عندك
                </button>
            </div>

            <div style="padding: 0 16px 5px 16px;">
                <h3 style="font-size:0.95rem; color:var(--text-secondary);"><i class="fa-solid fa-layer-group"></i> فئات الديون والعدادات العلوية:</h3>
            </div>

            <div class="categories-grid" id="categories-cards-target"></div>

            <div style="padding:10px 16px 30px 16px;">
                <h3 style="font-size:0.95rem; color:var(--text-secondary); margin-bottom:10px;"><i class="fa-solid fa-history"></i> سجل فواتير المشتريات والدفعات السابقة</h3>
                <div id="grocery-logs-target"></div>
            </div>

            <button class="btn-reset-system" onclick="executeSystemReset()">
                <i class="fa-solid fa-trash-arrow-up"></i> تصفير الدفتر والبدء من جديد
            </button>
        </div>
    </div>

    <div id="modal-add-bill" class="modal" onclick="closeModalOnOuterClick(event, 'modal-add-bill')">
        <div class="modal-content">
            <h3 style="color: var(--neon-blue); margin-bottom:15px;"><i class="fa-solid fa-plus-circle"></i> إضافة فاتورة / سحبة جديدة</h3>
            <p id="add-modal-title" style="color: var(--text-secondary); margin-bottom: 15px; font-size: 0.9rem;"></p>
            <input type="hidden" id="add-modal-cat-id">
            
            <div class="form-group">
                <label>البيان / الوصف (اختياري)</label>
                <input type="text" id="add-modal-reason" class="form-control" placeholder="مثال: مقاضي عشاء، فاتورة الشهر...">
            </div>
            <div class="form-group">
                <label>المبلغ المراد إضافته للمجموع (ر.س)</label>
                <input type="number" id="add-modal-amount" class="form-control" placeholder="0.00">
            </div>
            <button class="btn-submit" style="background: var(--neon-blue); color: #000;" onclick="executeAddBillToCategory()">تأكيد إضافة المبلغ للمجموع</button>
            <button class="btn-back" onclick="closeModal('modal-add-bill')">إلغاء</button>
        </div>
    </div>

    <div id="modal-pay-bill" class="modal" onclick="closeModalOnOuterClick(event, 'modal-pay-bill')">
        <div class="modal-content">
            <h3 style="color: var(--neon-green); margin-bottom:15px;"><i class="fa-solid fa-money-bill-wave"></i> تسديد مبلغ من المجموع الكلي</h3>
            <p id="pay-modal-title" style="color: var(--text-secondary); margin-bottom: 15px; font-size: 0.9rem;"></p>
            <input type="hidden" id="pay-modal-cat-id">
            
            <div class="form-group">
                <label>مبلغ التسديد الحالي (ر.س) - اكتب ما تقدر عليه</label>
                <input type="number" id="pay-modal-amount" class="form-control" placeholder="مثال: 50، 100...">
            </div>
            <button class="btn-submit" style="background: var(--neon-green); color: #000;" onclick="executePayFromCategoryTotal()">تأكيد خصم وتسديد المبلغ</button>
            <button class="btn-back" onclick="closeModal('modal-pay-bill')">إلغاء</button>
        </div>
    </div>

    <div id="modal-create-category" class="modal" onclick="closeModalOnOuterClick(event, 'modal-create-category')">
        <div class="modal-content">
            <h3 style="color: var(--neon-purple); margin-bottom:15px;"><i class="fa-solid fa-folder-plus"></i> إنشاء فئة فواتير جديدة</h3>
            <div class="form-group">
                <label>اسم الفئة الجديدة</label>
                <input type="text" id="new-cat-name" class="form-control" placeholder="مثال: صيدلية، بنزين السيارة، مغسلة...">
            </div>
            <button class="btn-submit" onclick="executeCreateCategory()">حفظ الفئة وظهورها فوق</button>
            <button class="btn-back" onclick="closeModal('modal-create-category')">إلغاء</button>
        </div>
    </div>

    <script>
        // قواعد البيانات المبسطة مع الربط بـ localStorage لمنع ضياع البيانات
        let state = {
            categories: [
                { id: 'cat_grocery', name: 'البقالة', total: 0, color: '#ff9100', icon: 'fa-basket-shopping' },
                { id: 'cat_net', name: 'الإنترنت', total: 0, color: '#00b0ff', icon: 'fa-globe' },
                { id: 'cat_electricity', name: 'الكهرباء والخدمات', total: 0, color: '#ffd600', icon: 'fa-bolt' }
            ],
            logs: []
        };

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('SIMPLE_GROCERY_BILL_DATA_2026');
            if(saved) {
                state = JSON.parse(saved);
            }
            renderAll();
        });

        function commit() {
            localStorage.setItem('SIMPLE_GROCERY_BILL_DATA_2026', JSON.stringify(state));
            renderAll();
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeModalOnOuterClick(e, id) { if(e.target.id === id) closeModal(id); }

        function switchMainTab(tab) {
            // صفحة واحدة سريعة ومباشرة ومستقرة
        }

        function renderAll() {
            // 1. حساب الإجمالي العام
            let globalTotal = state.categories.reduce((acc, c) => acc + c.total, 0);
            document.getElementById('grocery-total-bill').innerText = globalTotal.toFixed(2) + " ر.س";

            // 2. رندر كروت العدادات العلوية الفئات
            const cardsContainer = document.getElementById('categories-cards-target');
            cardsContainer.innerHTML = '';

            state.categories.forEach(cat => {
                const card = document.createElement('div');
                card.className = "cat-card";
                card.style.borderRight = `5px solid ${cat.color}`;
                
                card.innerHTML = `
                    <div class="cat-info">
                        <p style="color: var(--text-secondary); font-size: 0.85rem;"><i class="fa-solid ${cat.icon}" style="color:${cat.color}"></i> مجموع دين ${cat.name}:</p>
                        <h4 style="color: ${cat.color};">${cat.total.toFixed(2)} ر.س</h4>
                    </div>
                    <div class="cat-actions">
                        <button class="action-btn add" onclick="openAddBillModal('${cat.id}')"><i class="fa-solid fa-plus"></i> فاتورة</button>
                        <button class="action-btn pay" onclick="openPayBillModal('${cat.id}')"><i class="fa-solid fa-check"></i> تسديد</button>
                    </div>
                `;
                cardsContainer.appendChild(card);
            });

            // 3. رندر السجل التاريخي للحركات
            const logsContainer = document.getElementById('grocery-logs-target');
            logsContainer.innerHTML = '';

            if(state.logs.length === 0) {
                logsContainer.innerHTML = `<p style="color:var(--text-secondary); font-size:0.85rem; text-align:center; padding:20px;">السجل فارغ حالياً.</p>`;
            } else {
                state.logs.slice().reverse().forEach((l, idx) => {
                    const realIdx = state.logs.length - 1 - idx;
                    const div = document.createElement('div');
                    div.className = "list-item";
                    let isAdd = l.type === 'add';
                    let sideColor = isAdd ? "var(--neon-blue)" : "var(--neon-green)";
                    div.style.borderRight = `4px solid ${sideColor}`;

                    div.innerHTML = `
                        <div>
                            <span style="font-size:0.8rem; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,0.04); color:var(--text-secondary); font-weight:bold;">${l.catName}</span>
                            <h4 style="font-size:0.9rem; color:#fff; margin-top:4px;">${l.reason}</h4>
                            <small style="font-size:0.7rem; color:var(--text-secondary); display:block; margin-top:2px;"><i class="fa-regular fa-clock"></i> ${l.date}</small>
                        </div>
                        <div style="text-align:left; display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
                            <span style="font-weight:900; color:${sideColor}; font-family:'Plus Jakarta Sans';">${isAdd ? '+' : '-'} ${l.amount.toFixed(2)} ر.س</span>
                            <button style="background:transparent; border:none; color:rgba(255,23,68,0.4); font-size:0.75rem; cursor:pointer;" onclick="executeDeleteLog(${realIdx})"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    `;
                    logsContainer.appendChild(div);
                });
            }
        }

        // فتح مودال الإضافة لفئة معينة
        function openAddBillModal(catId) {
            const cat = state.categories.find(c => c.id === catId);
            if(!cat) return;
            document.getElementById('add-modal-cat-id').value = catId;
            document.getElementById('add-modal-title').innerText = `سيتم زيادة المبلغ مباشرة على مجموع [${cat.name}] الحالي.`;
            document.getElementById('add-modal-amount').value = '';
            document.getElementById('add-modal-reason').value = '';
            openModal('modal-add-bill');
        }

        function executeAddBillToCategory() {
            const catId = document.getElementById('add-modal-cat-id').value;
            const amt = parseFloat(document.getElementById('add-modal-amount').value);
            let reason = document.getElementById('add-modal-reason').value.trim();

            if(isNaN(amt) || amt <= 0) return alert("الرجاء كتابة مبلغ صحيح.");
            
            const cat = state.categories.find(c => c.id === catId);
            if(!cat) return;

            if(!reason) reason = `إضافة فاتورة مشتريات`;

            cat.total += amt;

            state.logs.push({
                type: 'add',
                catId: catId,
                catName: cat.name,
                amount: amt,
                reason: reason,
                date: new Date().toLocaleDateString('ar-SA') + ' ' + new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'})
            });

            closeModal('modal-add-bill');
            commit();
        }

        // فتح مودال التسديد الجزئي المرن من المجموع الكلي لفئة معينة
        function openPayBillModal(catId) {
            const cat = state.categories.find(c => c.id === catId);
            if(!cat) return;
            document.getElementById('pay-modal-cat-id').value = catId;
            document.getElementById('pay-modal-title').innerText = `المجموع الحالي لدين ${cat.name} هو (${cat.total.toFixed(2)} ر.س). اكتب المبلغ المراد سداده وخصمه منه:`;
            document.getElementById('pay-modal-amount').value = '';
            openModal('modal-pay-bill');
        }

        function executePayFromCategoryTotal() {
            const catId = document.getElementById('pay-modal-cat-id').value;
            const amt = parseFloat(document.getElementById('pay-modal-amount').value);

            if(isNaN(amt) || amt <= 0) return alert("الرجاء كتابة مبلغ تسديد صحيح.");
            
            const cat = state.categories.find(c => c.id === catId);
            if(!cat) return;

            if(amt > cat.total) {
                return alert(`مبلغ التسديد أكبر من المجموع الحالي للدين! المجموع الحالي هو فقط ${cat.total.toFixed(2)} ر.س`);
            }

            cat.total -= amt;

            state.logs.push({
                type: 'pay',
                catId: catId,
                catName: cat.name,
                amount: amt,
                reason: `💸 تسديد جزء من الحساب الإجمالي`,
                date: new Date().toLocaleDateString('ar-SA') + ' ' + new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'})
            });

            closeModal('modal-pay-bill');
            commit();
        }

        // إنشاء فئة مخصصة من قبل المستخدم
        function executeCreateCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if(!name) return alert("الرجاء كتابة اسم الفئة أولاً.");

            const id = 'cat_' + Date.now();
            const colors = ['#d500f9', '#ff1744', '#00e676', '#ff9100', '#00b0ff', '#ffd600'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            state.categories.push({
                id: id,
                name: name,
                total: 0,
                color: randomColor,
                icon: 'fa-folder-open'
            });

            document.getElementById('new-cat-name').value = '';
            closeModal('modal-create-category');
            commit();
        }

        // حذف حركة وتعديل الحسابات بناءً عليها تلقائياً والتراجع
        function executeDeleteLog(index) {
            if(!confirm("هل تريد حذف وتراجع هذه الحركة من السجل؟")) return;
            const log = state.logs[index];
            const cat = state.categories.find(c => c.id === log.catId);
            
            if(cat) {
                if(log.type === 'add') {
                    cat.total = Math.max(0, cat.total - log.amount);
                } else {
                    cat.total += log.amount;
                }
            }
            state.logs.splice(index, 1);
            commit();
        }

        function executeSystemReset() {
            if(confirm("⚠️ هل أنت متأكد من تصفير ومسح كافة فئات الديون والمبالغ للبدء من جديد؟")) {
                localStorage.removeItem('SIMPLE_GROCERY_BILL_DATA_2026');
                location.reload();
            }
        }
    </script>
</body>
</html>
